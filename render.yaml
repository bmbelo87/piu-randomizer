# Blueprint do Render: New + > Blueprint, escolha este repositorio.
services:
  - type: web
    name: piu-randomizer-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        value: file:./dev.db
      # Senha das rotas que gravam dados; voce informa o valor no painel do Render.
      - key: ADMIN_PASSWORD
        sync: false
